<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Palera1n / Dopamine Style Jailbreak</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: rgba(28, 28, 30, 0.75);
            --accent-color: #0A84FF;
            --text-primary: #FFFFFF;
            --text-secondary: #8E8E93;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 20px;
        }

        .header {
            text-align: center;
        }

        .app-title {
            font-size: 28px;
            font-weight: 700;
            margin: 0 0 5px 0;
            letter-spacing: 0.3px;
        }

        .device-info {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 15px;
        }

        /* iOS Toggle Switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 51px;
            height: 31px;
        }

        .switch input { 
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #39393D;
            transition: .3s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 31px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 27px;
            width: 27px;
            left: 2px;
            bottom: 2px;
            background-color: white;
            transition: .3s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 50%;
            box-shadow: 0 3px 8px rgba(0,0,0,0.15);
        }

        input:checked + .slider {
            background-color: #34C759;
        }

        input:checked + .slider:before {
            transform: translateX(20px);
        }

        /* Action Button */
        .btn-jailbreak {
            background: linear-gradient(135deg, #0A84FF, #0056b3);
            color: white;
            border: none;
            border-radius: 14px;
            padding: 16px;
            font-size: 17px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(10, 132, 255, 0.3);
            transition: transform 0.1s ease, opacity 0.2s;
        }

        .btn-jailbreak:active {
            transform: scale(0.97);
        }

        /* Console Output Box */
        .console {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 12px;
            padding: 12px;
            font-family: "SF Mono", Menlo, monospace;
            font-size: 12px;
            color: #34C759;
            height: 100px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .footer {
            font-size: 12px;
            color: var(--text-secondary);
            text-align: center;
            margin-bottom: 10px;
        }

        /* Simulated Respring Screen */
        #respring-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .apple-logo {
            width: 40px;
            fill: #ffffff;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1 class="app-title">Dopamine</h1>
            <div class="device-info" id="device-info">iOS 18.2 — iPhone (Unsupported Simulation)</div>
        </div>

        <div class="card">
            <div class="setting-row">
                <span>Enable Tweaks</span>
                <label class="switch">
                    <input type="checkbox" checked id="toggle-tweaks">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="setting-row">
                <span>Daemon Restrict</span>
                <label class="switch">
                    <input type="checkbox" checked id="toggle-daemon">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="setting-row">
                <span>Verbose Logs</span>
                <label class="switch">
                    <input type="checkbox" id="toggle-verbose">
                    <span class="slider"></span>
                </label>
            </div>
        </div>

        <div class="console" id="console-log">
            <div>[+] Ready to jailbreak.</div>
        </div>

        <button class="btn-jailbreak" id="action-btn" onclick="startJailbreak()">Jailbreak</button>
    </div>

    <div class="footer">
        Powered by WebKit Simulation • v2.0.4
    </div>

    <script>
        const consoleLog = document.getElementById('console-log');
        const actionBtn = document.getElementById('action-btn');
        const respringOverlay = document.getElementById('respring-overlay');

        function appendLog(text) {
            const div = document.createElement('div');
            div.textContent = text;
            consoleLog.appendChild(div);
            consoleLog.scrollTop = consoleLog.scrollHeight;
        }

        function startJailbreak() {
            actionBtn.disabled = true;
            actionBtn.style.opacity = '0.5';
            appendLog('[*] Initializing exploit chain...');

            setTimeout(() => {
                appendLog('[*] Bypassing PAC and PPL...');
            }, 1000);

            setTimeout(() => {
                appendLog('[*] Remounting root filesystem...');
            }, 2200);

            setTimeout(() => {
                appendLog('[+] Exploitation successful. Respringing...');
                triggerRespring();
            }, 3500);
        }

        function triggerRespring() {
            // Fade in the black screen with the Apple Logo
            respringOverlay.style.opacity = '1';

            // Simulate device coming back up after 2.5 seconds
            setTimeout(() => {
                respringOverlay.style.opacity = '0';
                appendLog('[+] Device resprung successfully.');
                actionBtn.disabled = false;
                actionBtn.style.opacity = '1';
                actionBtn.textContent = 'Jailbroken';
            }, 2500);
        }
    </script>
</body>
